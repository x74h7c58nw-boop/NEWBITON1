<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#060812"/>
  <meta name="description" content="시간표, 이동시간, 교통비까지 계산하는 나만의 알바 퀘스트 랭킹"/>
  <link rel="icon" href="/favicon.svg"/>
  <title>SSS급 알바 랭킹 | HUNTER SYSTEM</title>
</head>
<body>
  <div id="root"></div>

  <!-- 오디오 태그 -->
  <audio id="bg-music" src="/alexzavesa-dance-playful-night-510786.mp3" loop preload="auto"></audio>

  <!-- 화면 최상단 플로팅 버튼 -->
  <button id="bgm-toggle-btn" style="
    position: fixed;
    bottom: 30px;
    right: 30px;
    z-index: 999999;
    background-color: #060812;
    color: #00ffcc;
    border: 2px solid #00ffcc;
    padding: 12px 20px;
    border-radius: 50px;
    cursor: pointer;
    font-weight: bold;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.5);
  ">
    🎵 BGM OFF (클릭하여 재생)
  </button>

  <script type="module" src="/src/main.jsx"></script>

  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const audio = document.getElementById('bg-music');
      const toggleBtn = document.getElementById('bgm-toggle-btn');
      let isPlaying = false;

      function playAudio() {
        audio.play().then(() => {
          isPlaying = true;
          toggleBtn.innerText = '🔊 BGM ON';
          toggleBtn.style.color = '#00ffcc';
          toggleBtn.style.borderColor = '#00ffcc';
        }).catch(err => {
          console.warn('자동 재생이 차단되었습니다. 클릭이 필요합니다.', err);
        });
      }

      toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (isPlaying) {
          audio.pause();
          isPlaying = false;
          toggleBtn.innerText = '🎵 BGM OFF';
          toggleBtn.style.color = '#888888';
          toggleBtn.style.borderColor = '#888888';
        } else {
          playAudio();
        }
      });

      // 사용자 첫 클릭 시 자동 재생 시도
      const startOnInteraction = () => {
        if (!isPlaying) {
          playAudio();
        }
        document.removeEventListener('click', startOnInteraction);
      };

      document.addEventListener('click', startOnInteraction);
    });
  </script>
</body>
</html>
